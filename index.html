<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain</title>
<meta name="description" content="Manthan's learn book: folders of notes with diagrams, flashcards and quick checks.">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f1c17'/%3E%3Ctext x='16' y='21' font-family='Arial, sans-serif' font-size='13' font-weight='700' text-anchor='middle' fill='%23f5f1e8'%3ESB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:ital,wght@0,300..900;1,400..600&family=Caveat:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem('second-brain:theme')||localStorage.getItem('kosh:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
<div class="read-progress" id="readProgress"><i></i></div>

<header class="topbar">
  <button class="icon-btn menu-btn" type="button" data-action="menu" aria-label="Open folders"><span data-icon="menu"></span></button>
  <a class="brand" href="#/"><span class="brand-mark">SB</span><span class="brand-name">Second Brain</span></a>
  <button class="search-trigger" type="button" data-action="search" aria-label="Search notes"><span data-icon="search"></span><span class="st-label">Search notes</span><kbd>⌘K</kbd></button>
  <button class="icon-btn" type="button" data-action="theme" aria-label="Switch light or dark" id="themeBtn"></button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Folders"></aside>
  <div class="scrim" data-action="close-menu"></div>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="search" id="search" hidden>
  <div class="search-backdrop" data-action="close-search"></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search notes">
    <div class="search-bar">
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Search notes, tags, ideas…" autocomplete="off" spellcheck="false">
      <button class="kbd-btn" type="button" data-action="close-search">esc</button>
    </div>
    <div class="search-results" id="results"></div>
  </div>
</div>

<script src="assets/notes.js"></script>
<script src="assets/md.js"></script>
<script src="assets/editor.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
